<!doctype html>
<html lang="en">
<head>

<meta property="og:title" content="UPS Events | Campus screens and events in Chennai">
<meta property="og:description" content="Advertising screens inside Chennai's IT parks, and the pop-ups, markets and events that happen on the same floors.">
<meta property="og:type" content="website">
<meta property="og:locale" content="en_IN">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="UPS Events">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231C2333'/%3E%3Crect x='9' y='5' width='10' height='17' rx='2' fill='%23F0609A'/%3E%3Crect x='6' y='25' width='20' height='2.5' rx='1.2' fill='%23EEF2F5'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
<style>
/* ============ Tokens ============ */
:root{
  --glass:#EEF2F5;      /* page background: cool lobby glass */
  --paper:#FFFFFF;
  --ink:#121626;
  --muted:#525C70;
  --line:#D3DAE3;
  --granite:#1C2333;    /* screen bezels, dark sections */
  --granite-2:#2C3549;
  --on-dark:#E9EDF3;
  --on-dark-muted:#A7B1C2;
  --silk:#B5135C;       /* Kanchipuram silk magenta: the one accent */
  --silk-strong:#930D49;
  --silk-soft:#FBE3EE;
  --silk-on-dark:#F0609A;
  --peacock:#0E7A7E;    /* "open / available" */
  --peacock-soft:#DDF1F1;
  --amber:#7F4D00;
  --amber-soft:#FFF0D4;
  --error:#B42318;

  --r-sm:4px; --r:8px; --r-device:22px;
  --wrap:1160px; --gut:clamp(16px,4vw,32px);

  --fs-xs:.8125rem; --fs-sm:.9375rem; --fs-base:1.0625rem; --fs-md:1.25rem;
  --fs-lg:1.5rem; --fs-xl:clamp(1.625rem,3vw,2.125rem);
  --fs-2xl:clamp(2rem,4.2vw,3.125rem); --fs-hero:clamp(2.5rem,6vw,4.5rem);
}

/* ============ Base ============ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:88px}
body{margin:0;background:var(--glass);color:var(--ink);font-family:'Archivo',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;font-size:var(--fs-base);line-height:1.55;font-stretch:100%;-webkit-font-smoothing:antialiased}
img,svg{display:block;max-width:100%}
a{color:inherit}
p{margin:0 0 1em}
h1,h2,h3,h4{margin:0;font-weight:700;line-height:1.1}
ul,ol{margin:0}
button{font:inherit}
:focus-visible{outline:3px solid var(--silk);outline-offset:3px;border-radius:2px}
.dark :focus-visible{outline-color:var(--silk-on-dark)}
#main{outline:none}
#main h1[tabindex="-1"]:focus{outline:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.skip{position:absolute;left:-9999px;top:8px;z-index:100;background:var(--ink);color:#fff;padding:10px 14px;border-radius:var(--r);text-decoration:none;font-weight:600}
.skip:focus{left:16px}

/* ============ Type ============ */
.display{font-size:var(--fs-hero);font-stretch:125%;font-weight:760;line-height:1.0;letter-spacing:-.02em}
.h1{font-size:var(--fs-2xl);font-stretch:122%;font-weight:740;line-height:1.04;letter-spacing:-.015em;max-width:22ch}
.h2{font-size:var(--fs-xl);font-stretch:118%;font-weight:720;line-height:1.08;letter-spacing:-.01em;max-width:28ch}
.h3{font-size:var(--fs-md);font-stretch:112%;font-weight:680;line-height:1.2}
.lead{font-size:var(--fs-md);line-height:1.5;color:var(--muted);max-width:58ch;margin-top:18px}
.muted{color:var(--muted)}
.small{font-size:var(--fs-sm)}
.xs{font-size:var(--fs-xs)}
.measure{max-width:64ch}
.dark{background:var(--granite);color:var(--on-dark)}
.dark .lead,.dark .muted{color:var(--on-dark-muted)}
.stack>*+*{margin-top:16px}

/* ============ Layout ============ */
.wrap{max-width:var(--wrap);margin-inline:auto;padding-inline:var(--gut)}
.section{padding-block:clamp(56px,8vw,104px)}
.section.tight{padding-top:0}
.paper{background:var(--paper)}
.split{display:grid;gap:clamp(32px,5vw,64px)}
@media(min-width:900px){
  .split{grid-template-columns:minmax(0,1fr) minmax(0,1fr)}
  .split.wide-left{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr)}
  .split.wide-right{grid-template-columns:minmax(0,1fr) minmax(0,1.35fr)}
}
.sec-head{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:end;gap:16px 32px;margin-bottom:clamp(28px,4vw,44px)}
.sec-head .lead{margin-top:12px}

/* ============ Buttons & links ============ */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;min-height:48px;padding:.7em 1.25em;border-radius:var(--r);font-weight:650;font-stretch:110%;font-size:var(--fs-sm);line-height:1.2;text-decoration:none;border:2px solid transparent;cursor:pointer;transition:background-color .15s,color .15s,border-color .15s;text-align:center}
.btn--primary{background:var(--silk);color:#fff}
.btn--primary:hover{background:var(--silk-strong)}
.btn--ghost{border-color:var(--ink);color:var(--ink);background:transparent}
.btn--ghost:hover{background:var(--ink);color:#fff}
.dark .btn--ghost{border-color:var(--on-dark);color:var(--on-dark)}
.dark .btn--ghost:hover{background:var(--on-dark);color:var(--granite)}
.btn--wa{background:#167A43;color:#fff}
.btn--wa:hover{background:#0F6235}
.btn--sm{min-height:40px;padding:.5em .9em}
.btn-row{display:flex;flex-wrap:wrap;gap:12px;margin-top:28px}
.link{font-weight:650;color:var(--silk);text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
.link:hover{color:var(--silk-strong)}
.dark .link{color:var(--silk-on-dark)}
.links{display:flex;flex-wrap:wrap;gap:12px 28px;margin-top:24px}

/* ============ Demo banner ============ */
.demo{background:var(--silk-soft);color:#5B0A2E;font-size:var(--fs-xs)}
.demo .wrap{display:flex;gap:12px;align-items:center;justify-content:space-between;min-height:38px}
.demo button{background:none;border:0;color:inherit;font-weight:650;text-decoration:underline;cursor:pointer;padding:8px 0;flex:none}

/* ============ Header ============ */
.hdr{position:sticky;top:0;z-index:40;background:rgba(238,242,245,.95);backdrop-filter:saturate(1.2) blur(8px);border-bottom:1px solid var(--line)}
.hdr-in{display:flex;align-items:center;gap:20px;min-height:68px}
.brand{display:inline-flex;align-items:center;gap:10px;text-decoration:none;flex:none}
.brand-mark{width:30px;height:30px}
.brand-word{font-stretch:125%;font-weight:800;font-size:1.1875rem;letter-spacing:-.01em;line-height:1}
.brand-word span{font-weight:450;font-stretch:112%}
.nav{display:none}
.hdr-cta{margin-left:auto;display:flex;gap:10px;align-items:center}
.hdr-cta .wide-only,.hdr-cta .xl-only{display:none}
.hdr .btn{white-space:nowrap}
.hdr{transition:transform .28s cubic-bezier(.2,.8,.2,1);view-transition-name:hdr}
.hdr--away{transform:translateY(-100%)}
.icon-btn{display:inline-grid;place-items:center;width:44px;height:44px;border-radius:50%;border:1.5px solid var(--line);background:var(--paper);color:#167A43;text-decoration:none}
.icon-btn svg{width:22px;height:22px}
@media(min-width:1100px){
  .nav{display:flex;gap:2px;margin-left:12px}
  .nav a{padding:8px 11px;border-radius:var(--r-sm);text-decoration:none;font-weight:560;font-size:var(--fs-sm);font-stretch:106%}
  .nav a:hover{background:rgba(28,35,51,.07)}
  .nav a[aria-current="page"]{color:var(--silk);box-shadow:inset 0 -2px 0 var(--silk);border-radius:0}
  .hdr-cta .wide-only{display:inline-flex}
  .hdr-cta .icon-btn{display:none}
}
@media(min-width:1300px){
  .hdr-cta .xl-only{display:inline-flex}
}
.wa-link{display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:var(--fs-sm);text-decoration:none;padding:8px 4px}
.wa-link svg,.btn svg{flex:none;max-width:none}
.wa-link svg{width:18px;height:18px;color:#167A43}

/* ============ Mobile app shell: tab bar, context bar, bottom sheet ============ */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:45;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));align-items:end;padding:6px max(6px,env(safe-area-inset-left)) calc(6px + env(safe-area-inset-bottom)) max(6px,env(safe-area-inset-right));background:rgba(255,255,255,.94);backdrop-filter:saturate(1.4) blur(14px);-webkit-backdrop-filter:saturate(1.4) blur(14px);border-top:1px solid var(--line);view-transition-name:tabbar}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:3px;min-height:54px;padding:0 2px;text-decoration:none;color:var(--muted);font:inherit;font-size:.6875rem;font-weight:640;font-stretch:104%;letter-spacing:.01em;background:none;border:0;cursor:pointer;border-radius:12px}
.tab-ico{display:grid;place-items:center;width:58px;height:30px;border-radius:15px;transition:background-color .2s,transform .12s}
.tab-ico svg{width:23px;height:23px}
.tab[aria-current="page"],.tab[aria-expanded="true"]{color:var(--silk)}
.tab[aria-current="page"] .tab-ico,.tab[aria-expanded="true"] .tab-ico{background:var(--silk-soft)}
.tab-fab{display:grid;place-items:center;width:54px;height:54px;margin-top:-30px;border-radius:18px;background:var(--silk);color:#fff;box-shadow:0 12px 24px -10px rgba(181,19,92,.75),0 0 0 5px var(--paper);transition:transform .12s,background-color .15s}
.tab-fab svg{width:26px;height:26px}
.tab--brief{color:var(--ink)}
.tab--brief[aria-current="page"]{color:var(--silk)}
.tab--brief[aria-current="page"] .tab-fab{background:var(--silk-strong)}
@media(max-width:1099px){body{padding-bottom:calc(70px + env(safe-area-inset-bottom))}}
@media(min-width:1100px){.tabbar{display:none}}

.ctxbar{position:fixed;left:max(10px,env(safe-area-inset-left));right:max(10px,env(safe-area-inset-right));bottom:calc(76px + env(safe-area-inset-bottom));z-index:44;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 10px 10px 16px;background:var(--granite);color:var(--on-dark);border-radius:16px;box-shadow:0 18px 36px -16px rgba(18,22,38,.65);transition:transform .3s cubic-bezier(.2,.8,.2,1),opacity .25s;animation:ctxin .35s cubic-bezier(.2,.8,.2,1)}
.ctxbar[hidden]{display:none}
.ctxbar.away{transform:translateY(calc(100% + 96px));opacity:0;pointer-events:none}
.ctx-info{min-width:0}
.ctx-info b{display:block;font-stretch:112%;font-weight:720;font-variant-numeric:tabular-nums;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ctx-info span{display:block;font-size:var(--fs-xs);color:var(--on-dark-muted)}
.ctxbar .btn{flex:none}
.ctxbar .btn:disabled{background:var(--granite-2);color:var(--on-dark-muted);cursor:not-allowed}
@keyframes ctxin{from{transform:translateY(24px);opacity:0}}
@media(min-width:760px){.ctxbar{display:none!important}}
@media(max-width:759px){body.has-ctx{padding-bottom:calc(150px + env(safe-area-inset-bottom))}}

html.locked,html.locked body{overflow:hidden}
.sheet-host{position:fixed;inset:0;z-index:60}
.sheet-host[hidden]{display:none}
.sheet-backdrop{position:absolute;inset:0;background:rgba(12,16,26,.52);opacity:0;transition:opacity .28s}
.sheet-host.open .sheet-backdrop{opacity:1}
.sheet{position:absolute;left:0;right:0;bottom:0;display:flex;flex-direction:column;max-height:90vh;max-height:90dvh;background:var(--glass);border-radius:22px 22px 0 0;transform:translateY(102%);transition:transform .34s cubic-bezier(.2,.8,.2,1),translate .25s cubic-bezier(.2,.8,.2,1);box-shadow:0 -12px 40px -12px rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom);outline:none}
.sheet-host.open .sheet{transform:none}
.sheet.dragging{transition:none}
.sheet-grab{display:grid;place-items:center;height:24px;flex:none;cursor:grab;touch-action:none}
.sheet-grab i{width:42px;height:5px;border-radius:3px;background:#B4BECB}
.sheet-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:0 14px 10px 20px;flex:none;touch-action:none}
.sheet-title{font-size:var(--fs-md);font-stretch:118%;font-weight:740}
.sheet-x{display:grid;place-items:center;width:40px;height:40px;border-radius:50%;border:0;background:#DCE3EA;color:var(--ink);cursor:pointer;flex:none}
.sheet-x svg{width:18px;height:18px}
.sheet-body{overflow-y:auto;overscroll-behavior:contain;padding:2px 16px 24px;-webkit-overflow-scrolling:touch}
@media(min-width:760px){.sheet{left:50%;right:auto;width:min(560px,100%);transform:translate(-50%,102%)}.sheet-host.open .sheet{transform:translate(-50%,0)}}

.quick{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.quick-tile{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;min-height:78px;border-radius:16px;background:var(--paper);border:1px solid var(--line);text-decoration:none;font-weight:650;font-size:var(--fs-sm)}
.quick-tile svg{width:24px;height:24px}
.quick-tile--wa{background:#167A43;border-color:#167A43;color:#fff}
.sheet-promo{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:14px 16px;border-radius:16px;background:#151A2B;color:var(--on-dark);text-decoration:none}
.sheet-promo b{display:block;font-stretch:114%;font-weight:720}
.sheet-promo span{display:block;font-size:var(--fs-xs);color:var(--on-dark-muted)}
.sheet-promo em{font-style:normal;font-weight:700;font-size:var(--fs-sm);color:#fff;background:var(--silk);padding:9px 14px;border-radius:var(--r);flex:none}
.dest{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.dest a{display:flex;align-items:center;gap:12px;min-height:60px;padding:10px 14px;border-radius:14px;background:var(--paper);border:1px solid var(--line);text-decoration:none;font-weight:620;font-size:var(--fs-sm);line-height:1.25}
.dest a svg{width:22px;height:22px;flex:none;color:var(--silk)}
.dest a[aria-current="page"]{border-color:var(--silk);background:#FDF5F9}
.sheet-legal{display:flex;flex-wrap:wrap;gap:6px 18px;margin:18px 4px 0;font-size:var(--fs-xs)}
.sheet-legal a{color:var(--muted)}

/* ============ Page header ============ */
.phead{padding-block:clamp(36px,6vw,80px) clamp(32px,5vw,56px)}
.phead.dark{padding-bottom:clamp(40px,6vw,72px)}
.crumbs ol{display:flex;flex-wrap:wrap;gap:6px;list-style:none;padding:0;margin:0 0 20px;font-size:var(--fs-sm);color:var(--muted)}
.dark .crumbs ol{color:var(--on-dark-muted)}
.crumbs li+li::before{content:"/";margin-right:6px;opacity:.5}
.crumbs a{text-underline-offset:3px}
.back{display:none;align-items:center;gap:4px;margin:0 0 14px -6px;padding:8px 10px 8px 6px;min-height:40px;border-radius:var(--r);font-weight:650;font-size:var(--fs-sm);text-decoration:none;color:var(--silk)}
.back svg{width:18px;height:18px}
.dark .back,.show .back{color:var(--silk-on-dark)}
.share-btn svg{width:18px;height:18px}

/* ============ Hero ============ */
.hero{padding-block:clamp(36px,6vw,72px) clamp(48px,7vw,88px);overflow:hidden}
.hero-grid{display:grid;gap:28px 48px;grid-template-areas:"copy" "act" "scene";align-items:center}
.hero-copy{grid-area:copy}.hero-act{grid-area:act}.scene{grid-area:scene}
.hero-act .btn-row{margin-top:0}
@media(min-width:960px){.hero-grid{grid-template-columns:minmax(0,1.2fr) minmax(0,.8fr);grid-template-areas:"copy scene" "act scene";align-content:center}.hero-copy{align-self:end}.hero-act{align-self:start}}
.hero .display{max-width:13ch}
.hero-fact{margin-top:28px;font-size:var(--fs-sm);color:var(--muted);display:flex;gap:10px;align-items:baseline;max-width:52ch}
.live-dot{width:9px;height:9px;border-radius:50%;background:var(--peacock);flex:none;box-shadow:0 0 0 4px var(--peacock-soft)}

/* Pod scene: the one bold element */
.scene{display:grid;grid-template-columns:auto minmax(0,1fr);align-items:end;column-gap:clamp(14px,3vw,28px);max-width:470px;margin-inline:auto;width:100%}
.pod{width:clamp(196px,22vw,236px)}
.pod-bezel{background:var(--granite);border-radius:var(--r-device);padding:11px 11px 14px;box-shadow:0 34px 60px -32px rgba(28,35,51,.6)}
.pod-screen{position:relative;aspect-ratio:9/16;border-radius:10px;overflow:hidden;background:#0B0F1A}
.pod-screen::before{content:"";position:absolute;inset:0 0 auto;height:44px;background:linear-gradient(rgba(10,14,24,.32),rgba(10,14,24,0));z-index:2;pointer-events:none}
.segs{position:absolute;top:9px;left:9px;right:9px;z-index:3;display:flex;gap:3px;pointer-events:none}
.segs i{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.38);overflow:hidden}
.segs b{display:block;height:100%;width:0;background:#fff;border-radius:2px}
.segs i.done b{width:100%}
.segs i.now b{animation:segfill var(--dur,3600ms) linear forwards}
.pod-screen.paused .segs i.now b{animation-play-state:paused}
@keyframes segfill{from{width:0}to{width:100%}}
.tap{position:absolute;top:0;bottom:0;z-index:4;background:transparent;border:0;padding:0;margin:0;cursor:pointer;touch-action:pan-y;-webkit-tap-highlight-color:transparent;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.tap--prev{left:0;width:34%}.tap--next{right:0;width:66%}
.tap:focus-visible{outline:3px solid #fff;outline-offset:-5px;border-radius:8px}
.held-tag{position:absolute;left:50%;top:50%;z-index:5;transform:translate(-50%,-50%);background:rgba(12,16,26,.72);color:#fff;font-size:.75rem;font-weight:650;padding:6px 12px;border-radius:999px;opacity:0;transition:opacity .15s;pointer-events:none}
.pod-screen.held .held-tag{opacity:1}
.ad{position:absolute;inset:0;padding:26px 15px 16px;display:flex;flex-direction:column;justify-content:space-between;opacity:0;transition:opacity .45s ease}
.ad--you .ad-head{font-size:1.25rem}
.ad-cta{position:relative;z-index:6;display:inline-flex;align-items:center;justify-content:center;min-height:40px;padding:8px 14px;border-radius:var(--r);background:#fff;color:var(--silk-strong);font-weight:720;font-size:.8125rem;text-decoration:none;white-space:nowrap}
.ad.on{opacity:1}
.ad-brand{font-size:.75rem;font-weight:700;font-stretch:110%;letter-spacing:.01em}
.ad-head{font-size:1.4rem;font-stretch:122%;font-weight:780;line-height:1.02;letter-spacing:-.01em}
.ad-foot{display:flex;justify-content:space-between;align-items:end;gap:10px;font-size:.75rem;line-height:1.3;font-weight:550}
.ad-foot svg{width:46px;height:46px;flex:none;border-radius:3px}
.pod-meta{display:flex;align-items:center;gap:10px;color:var(--on-dark-muted);font-size:.75rem;margin-top:11px;font-variant-numeric:tabular-nums}
.pod-meta{justify-content:space-between}
.pod-neck{width:16px;height:44px;background:linear-gradient(90deg,#141a27,#2C3549,#141a27);margin-inline:auto}
.pod-foot{width:112px;height:9px;border-radius:6px 6px 0 0;background:var(--granite);margin-inline:auto}
.stall{width:100%;max-width:200px}
.floor{grid-column:1/-1;height:3px;background:var(--ink);border-radius:2px}
.only-narrow{display:none}
.scene-cap{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:12px;font-size:var(--fs-xs);color:var(--muted)}
.pause{display:inline-flex;align-items:center;gap:6px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 11px;font-size:var(--fs-xs);font-weight:650;cursor:pointer;color:var(--ink);flex:none}
.pause svg{width:12px;height:12px}

/* ============ Two ways ============ */
.ways{display:grid;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
@media(min-width:900px){.ways{grid-template-columns:1fr 1fr}}
.way{padding:clamp(28px,4vw,48px);display:flex;flex-direction:column}
.way--floor{background:var(--paper)}
.way p{max-width:46ch}
.way .links{margin-top:auto;padding-top:8px}
.speclist{list-style:none;padding:0;margin:24px 0 28px;border-top:1px solid var(--line)}
.dark .speclist{border-color:var(--granite-2)}
.speclist li{display:flex;justify-content:space-between;align-items:baseline;gap:16px;padding:12px 0;border-bottom:1px solid var(--line)}
.dark .speclist li{border-color:var(--granite-2)}
.speclist li>span:last-child{color:var(--muted);text-align:right;font-size:var(--fs-sm)}
.dark .speclist li>span:last-child{color:var(--on-dark-muted)}
.speclist a{text-decoration:none;font-weight:600}
.speclist a:hover{text-decoration:underline;text-underline-offset:3px}

/* ============ Loop explainer ============ */
.loop{margin-top:8px}
.loop-track{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:4px}
.loop-track span{height:64px;border-radius:3px;background:#C7D0DB;display:flex;align-items:flex-end;justify-content:center;padding-bottom:6px;font-size:.6875rem;color:#3E475A;font-variant-numeric:tabular-nums}
.loop-track span.you{background:var(--silk);color:#fff;font-weight:700}
.loop-scale{display:flex;justify-content:space-between;font-size:var(--fs-xs);color:var(--muted);margin-top:8px;font-variant-numeric:tabular-nums}
.loop-key{display:flex;gap:20px;flex-wrap:wrap;margin-top:14px;font-size:var(--fs-xs);color:var(--muted)}
.loop-key i{display:inline-block;width:12px;height:12px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:#C7D0DB}
.loop-key i.you{background:var(--silk)}
.facts{display:grid;gap:24px;margin-top:40px}
@media(min-width:760px){.facts{grid-template-columns:repeat(3,1fr)}}
.fact{border-top:2px solid var(--ink);padding-top:14px}
.dark .fact{border-color:var(--on-dark)}
.fact b{display:block;font-size:var(--fs-lg);font-stretch:118%;font-weight:720;margin-bottom:4px}
.fact span{color:var(--muted);font-size:var(--fs-sm)}
.dark .fact span{color:var(--on-dark-muted)}

/* ============ Week timeline ============ */
.weeks{list-style:none;padding:0;display:grid;gap:0;margin-top:8px}
@media(min-width:900px){.weeks{grid-template-columns:repeat(4,1fr)}}
.weeks li{padding:18px 0 26px;border-top:2px solid var(--ink)}
@media(min-width:900px){.weeks li{padding-right:28px}}
.weeks .wk{display:block;font-stretch:118%;font-weight:740;font-size:var(--fs-md);margin-bottom:12px}
.weeks dl{margin:0}
.weeks dt{font-size:var(--fs-xs);font-weight:700;color:var(--silk);margin-top:10px}
.weeks dd{margin:2px 0 0;font-size:var(--fs-sm)}

/* ============ Directory board ============ */
.board{background:#131927;border:1px solid var(--granite-2);border-radius:var(--r);overflow:hidden}
.board-head,.board-row{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1.3fr) minmax(0,.8fr) minmax(0,.8fr) minmax(0,.9fr);gap:16px;padding:16px 22px;align-items:center}
.board-head{font-size:var(--fs-xs);color:var(--on-dark-muted);border-bottom:1px solid var(--granite-2)}
.board-row{border-bottom:1px solid var(--granite-2);text-decoration:none;color:var(--on-dark);font-variant-numeric:tabular-nums}
.board-row:last-child{border-bottom:0}
a.board-row:hover{background:#192132}
.board-row .bname{font-stretch:116%;font-weight:700;font-size:var(--fs-md)}
@media(max-width:759px){
  .board-head{display:none}
  .board-row{grid-template-columns:1fr 1fr;row-gap:6px}
  .board-row .bname,.board-row .barea{grid-column:1/-1}
  .board-row .bcount::before{content:attr(data-label) " ";color:var(--on-dark-muted)}
}
.status{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:650;padding:4px 9px;border-radius:var(--r-sm);white-space:nowrap;width:max-content}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.status--live{background:var(--peacock-soft);color:#075A5D}
.status--soon{background:var(--amber-soft);color:var(--amber)}
.status--full{background:#E7EBF0;color:#495266}
.dark .status--live{background:rgba(14,122,126,.28);color:#8FE0E2}
.dark .status--soon{background:rgba(255,193,79,.16);color:#FFD27F}

/* ============ Work ============ */
.work-grid{display:grid;gap:24px}
@media(min-width:760px){.work-grid{grid-template-columns:repeat(3,1fr)}}
.tile{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;display:flex;flex-direction:column}
.tile-art{aspect-ratio:4/3;background:var(--granite)}
.tile-art svg{width:100%;height:100%}
.tile-body{padding:20px 22px 24px}
.tile-type{font-size:var(--fs-xs);font-weight:650;color:var(--silk)}
.tile h3{margin:6px 0 10px}
.tile .result{margin-top:14px;padding-top:12px;border-top:1px solid var(--line);font-weight:650;font-size:var(--fs-sm)}
.sample-tag{display:inline-block;font-size:.6875rem;font-weight:700;background:var(--amber-soft);color:var(--amber);padding:2px 7px;border-radius:var(--r-sm);margin-left:8px;vertical-align:1px}
.case{display:grid;gap:28px;padding-block:40px;border-top:1px solid var(--line)}
.case:first-child{border-top:0;padding-top:0}
@media(min-width:900px){.case{grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);align-items:center}.case:nth-child(even) .case-art{order:2}}
.case-art{border-radius:var(--r);overflow:hidden;aspect-ratio:4/3;background:var(--granite)}
.case-art svg{width:100%;height:100%}
.case dl{display:grid;grid-template-columns:max-content 1fr;gap:10px 20px;margin:20px 0 0}
.case dt{font-weight:650;font-size:var(--fs-sm)}
.case dd{margin:0;color:var(--muted);font-size:var(--fs-sm)}

/* ============ Rows (event types, audience) ============ */
.rows{border-top:2px solid var(--ink)}
.row{display:grid;gap:12px 32px;padding:28px 0;border-bottom:1px solid var(--line)}
@media(min-width:860px){.row{grid-template-columns:minmax(0,1fr) minmax(0,1.3fr) auto;align-items:start}}
.row p{margin:0}
.row .who{color:var(--muted);font-size:var(--fs-sm);margin-top:6px}
.row .link{white-space:nowrap}
.duo{display:grid;gap:0;border-top:2px solid var(--ink)}
@media(min-width:860px){.duo{grid-template-columns:1fr 1fr}.duo>div+div{border-left:1px solid var(--line);padding-left:36px}}
.duo>div{padding:28px 32px 28px 0;border-bottom:1px solid var(--line)}
@media(max-width:859px){.duo>div{padding-right:0}}

/* ============ Definition lists ============ */
.defs{display:grid;gap:0;margin:0}
@media(min-width:760px){.defs.two{grid-template-columns:1fr 1fr;column-gap:40px}}
.defs>div{padding:18px 0;border-top:1px solid var(--line)}
.dark .defs>div{border-color:var(--granite-2)}
.defs dt{font-weight:680;font-stretch:108%}
.defs dd{margin:4px 0 0;color:var(--muted);font-size:var(--fs-sm)}
.dark .defs dd{color:var(--on-dark-muted)}
.checks{list-style:none;padding:0;margin:16px 0 0}
.checks li{position:relative;padding:9px 0 9px 30px;border-bottom:1px solid var(--line)}
.checks li::before{content:"";position:absolute;left:2px;top:15px;width:14px;height:8px;border-left:2.5px solid var(--peacock);border-bottom:2.5px solid var(--peacock);transform:rotate(-45deg)}
.dark .checks li{border-color:var(--granite-2)}

/* ============ Steps (true sequences only) ============ */
.steps{list-style:none;padding:0;counter-reset:st;display:grid;gap:0}
@media(min-width:760px){.steps.cols{grid-template-columns:repeat(3,1fr);column-gap:32px}}
.steps li{counter-increment:st;position:relative;padding:20px 0 22px 56px;border-top:1px solid var(--line)}
.steps li::before{content:counter(st);position:absolute;left:0;top:18px;width:38px;height:38px;border-radius:50%;border:2px solid var(--ink);display:grid;place-items:center;font-weight:740;font-stretch:115%;font-size:var(--fs-sm)}
.dark .steps li{border-color:var(--granite-2)}
.dark .steps li::before{border-color:var(--on-dark)}
.steps h3{font-size:var(--fs-base);font-stretch:110%;font-weight:700;margin-bottom:4px}
.steps p{margin:0;color:var(--muted);font-size:var(--fs-sm)}
.dark .steps p{color:var(--on-dark-muted)}

/* ============ Tables ============ */
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--paper)}
table{width:100%;border-collapse:collapse;font-size:var(--fs-sm)}
caption{text-align:left;padding:14px 18px;font-weight:650;border-bottom:1px solid var(--line)}
th,td{text-align:left;padding:14px 18px;border-bottom:1px solid var(--line);vertical-align:top}
thead th{font-weight:650;background:#F5F7FA;white-space:nowrap}
tbody tr:last-child td,tbody tr:last-child th{border-bottom:0}
tbody th{font-weight:650}
.num{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}

/* ============ FAQ ============ */
.faq{border-top:2px solid var(--ink)}
.faq details{border-bottom:1px solid var(--line)}
.faq summary{list-style:none;cursor:pointer;padding:20px 40px 20px 0;font-weight:650;font-stretch:106%;position:relative}
.faq summary::-webkit-details-marker{display:none}
.faq summary::after{content:"";position:absolute;right:6px;top:26px;width:10px;height:10px;border-right:2px solid var(--ink);border-bottom:2px solid var(--ink);transform:rotate(45deg);transition:transform .2s}
.faq details[open] summary::after{transform:rotate(-135deg);top:30px}
.faq details>div{padding:0 0 22px;color:var(--muted);max-width:68ch}

/* ============ Forms ============ */
.form{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:clamp(20px,3vw,32px);color:var(--ink)}
.form h2,.form h3{margin-bottom:6px}
.fgrid{display:grid;gap:18px;margin-top:22px}
@media(min-width:640px){.fgrid{grid-template-columns:1fr 1fr}.fgrid .full{grid-column:1/-1}}
.field label,.field legend{display:block;font-weight:620;font-size:var(--fs-sm);margin-bottom:7px;padding:0}
.field .opt{font-weight:450;color:var(--muted)}
.field input[type=text],.field input[type=email],.field input[type=tel],.field select,.field textarea{width:100%;font:inherit;font-size:1rem;padding:11px 13px;border:1.5px solid #B4BECB;border-radius:var(--r-sm);background:#fff;color:var(--ink);min-height:48px}
.field textarea{min-height:120px;resize:vertical}
.field select{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink) 50%),linear-gradient(135deg,var(--ink) 50%,transparent 50%);background-position:calc(100% - 20px) 21px,calc(100% - 14px) 21px;background-size:6px 6px;background-repeat:no-repeat;padding-right:38px}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--silk);box-shadow:0 0 0 3px var(--silk-soft)}
.field.bad input,.field.bad select,.field.bad textarea{border-color:var(--error)}
.ferr{color:var(--error);font-size:var(--fs-xs);font-weight:620;margin-top:6px}
.fhint{color:var(--muted);font-size:var(--fs-xs);margin-top:6px}
fieldset.field{border:0;margin:0;padding:0;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{position:relative}
.chip input{position:absolute;opacity:0;inset:0;cursor:pointer;margin:0}
.chip span{display:inline-flex;align-items:center;min-height:44px;padding:8px 16px;border:1.5px solid #B4BECB;border-radius:var(--r);font-weight:580;font-size:var(--fs-sm);background:#fff}
.chip input:checked+span{border-color:var(--silk);background:var(--silk-soft);color:var(--silk-strong)}
.chip input:focus-visible+span{outline:3px solid var(--silk);outline-offset:2px}
.factions{display:flex;flex-wrap:wrap;align-items:center;gap:12px 18px;margin-top:24px}
.fnote{font-size:var(--fs-xs);color:var(--muted);max-width:36ch}
.done h3{font-size:var(--fs-lg);font-stretch:116%;margin-bottom:8px}
.done pre{white-space:pre-wrap;font:inherit;font-size:var(--fs-sm);background:var(--glass);border-radius:var(--r-sm);padding:14px 16px;margin:10px 0 0;color:var(--ink)}
.done details{margin-top:18px}
.done summary{cursor:pointer;font-weight:620;font-size:var(--fs-sm)}

/* ============ Availability ============ */
.avail{display:grid;gap:24px;align-items:start}
@media(min-width:1000px){.avail{grid-template-columns:minmax(0,1.5fr) minmax(330px,1fr)}}
.controls{display:grid;gap:16px;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px 22px;margin-bottom:16px}
@media(min-width:640px){.controls{grid-template-columns:1fr 1fr}}
.units{list-style:none;padding:0;margin:0;background:var(--paper);border:1px solid var(--line);border-radius:var(--r)}
.unit{border-bottom:1px solid var(--line)}
.unit:last-child{border-bottom:0}
.unit label{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:14px;align-items:center;padding:15px 20px;cursor:pointer}
.unit input{width:22px;height:22px;accent-color:var(--silk);margin:0;cursor:pointer}
.unit.off label{cursor:default}
.unit.off .unit-name{color:var(--muted)}
.unit-name{font-weight:650}
.unit-meta{font-size:var(--fs-xs);color:var(--muted);margin-top:2px}
.unit-state{text-align:right;font-size:var(--fs-xs);font-weight:640;display:grid;justify-items:end;gap:6px}
.slots{display:grid;grid-template-columns:repeat(12,6px);gap:2px}
.slots i{height:14px;border-radius:1px;background:var(--peacock)}
.slots i.sold{background:#CDD5DF}
.unit.sel{background:#FDF5F9}
.avail-hint{display:none;margin:0 0 12px}
@media(max-width:560px){.unit label{grid-template-columns:24px minmax(0,1fr)}.unit-state{grid-column:2;justify-items:start;text-align:left}}
.summary{display:grid;gap:16px}
@media(min-width:1000px){.summary{position:sticky;top:88px}}
.sum-box{background:var(--granite);color:var(--on-dark);border-radius:var(--r);padding:22px}
.sum-box ul{list-style:none;padding:0;margin:12px 0 0;font-size:var(--fs-sm)}
.sum-box li{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-bottom:1px solid var(--granite-2)}
.sum-lines{margin-top:14px;font-size:var(--fs-sm);font-variant-numeric:tabular-nums}
.sum-lines div{display:flex;justify-content:space-between;padding:4px 0}
.sum-lines .total{font-weight:720;font-size:var(--fs-md);border-top:1px solid var(--granite-2);margin-top:6px;padding-top:10px}
.minline{font-size:var(--fs-xs);margin-top:10px;color:var(--on-dark-muted)}
.minline.ok{color:#8FE0E2}

/* ============ Calculator ============ */
.calc{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.calc-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:center;padding:16px 22px;border-bottom:1px solid var(--line)}
.calc-row small{display:block;color:var(--muted);font-size:var(--fs-xs)}
.stepper{display:inline-flex;align-items:center;border:1.5px solid #B4BECB;border-radius:var(--r);overflow:hidden}
.stepper button{width:44px;height:44px;border:0;background:#fff;cursor:pointer;font-size:1.25rem;font-weight:600;color:var(--ink)}
.stepper button:hover{background:var(--glass)}
.stepper button:disabled{color:#B4BECB;cursor:not-allowed}
.stepper output{min-width:40px;text-align:center;font-weight:700;font-variant-numeric:tabular-nums}

/* ============ Formats frame ============ */
.frame{width:min(240px,100%);margin-inline:auto;aspect-ratio:9/16;border:2px solid var(--ink);border-radius:6px;position:relative;background:var(--paper);display:grid;grid-template-rows:auto 1fr auto;padding:22px 18px;gap:10px}
.frame::after{content:"";position:absolute;inset:10px;border:1.5px dashed var(--silk);border-radius:3px;pointer-events:none}
.frame div{border-radius:3px;background:var(--glass);display:grid;place-items:center;font-size:var(--fs-xs);font-weight:620;color:var(--muted);text-align:center;padding:8px}
.frame .f-logo{height:44px}
.frame .f-msg{background:var(--silk-soft);color:var(--silk-strong)}
.frame .f-qr{height:70px;width:70px;justify-self:end}

/* ============ Contact band ============ */
.band{display:grid;gap:28px;align-items:end}
@media(min-width:900px){.band{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr)}}
.contact-list{list-style:none;padding:0;margin:0;display:grid;gap:12px;font-size:var(--fs-sm)}
.contact-list a{text-decoration:none;font-weight:600}
.contact-list a:hover{text-decoration:underline;text-underline-offset:3px}
.contact-list span{display:block;color:var(--muted);font-size:var(--fs-xs)}
.dark .contact-list span{color:var(--on-dark-muted)}

/* ============ Show / tickets ============ */
.show{background:#151A2B;color:var(--on-dark);position:relative;overflow:hidden}
.show .kolam{position:absolute;inset:0;opacity:.5;pointer-events:none}
.show .wrap{position:relative}
.show .lead{color:var(--on-dark-muted)}
.show .crumbs ol{color:var(--on-dark-muted)}
.show-title{font-size:var(--fs-hero);font-stretch:125%;font-weight:800;line-height:.98;letter-spacing:-.02em;max-width:12ch}
.when{display:flex;flex-wrap:wrap;gap:10px 28px;margin-top:26px;font-size:var(--fs-md);font-stretch:110%;font-weight:600}
.when span{display:block;font-size:var(--fs-xs);color:var(--on-dark-muted);font-weight:500;font-stretch:100%}
.ticket{background:var(--paper);color:var(--ink);border-radius:var(--r);padding:clamp(20px,3vw,30px);position:relative;overflow:visible}
.ticket{--tpad:clamp(20px,3vw,30px)}
.ticket .tear{position:relative}
.ticket .tear::before,.ticket .tear::after{content:"";position:absolute;width:22px;height:22px;border-radius:50%;background:#151A2B;top:-12px}
.ticket .tear::before{left:calc(-1 * var(--tpad) - 11px)}.ticket .tear::after{right:calc(-1 * var(--tpad) - 11px)}
.ticket .price{font-size:var(--fs-xl);font-stretch:120%;font-weight:780}
.ticket .tear{border-top:2px dashed var(--line);margin:20px 0}
.lineup{list-style:none;padding:0;margin:0;border-top:2px solid var(--ink)}
.lineup li{display:grid;grid-template-columns:110px 1fr;gap:16px;padding:16px 0;border-bottom:1px solid var(--line)}
.lineup b{font-variant-numeric:tabular-nums;font-stretch:110%}
.ticket .form{border:0;padding:0;background:none}
.ticket .fgrid{grid-template-columns:1fr}
.ended{background:var(--amber-soft);color:var(--amber);border-radius:var(--r);padding:16px 18px;font-weight:600;margin-top:24px}

/* ============ Footer ============ */
.foot{background:var(--granite);color:var(--on-dark);padding-block:56px 28px;font-size:var(--fs-sm)}
.foot-grid{display:grid;gap:36px}
@media(min-width:760px){.foot-grid{grid-template-columns:1.4fr 1fr 1fr 1fr}}
.foot h2{font-size:var(--fs-sm);font-weight:700;margin-bottom:12px;color:var(--on-dark)}
.foot ul{list-style:none;padding:0;display:grid;gap:9px}
.foot a{color:var(--on-dark-muted);text-decoration:none}
.foot a:hover{color:var(--on-dark);text-decoration:underline;text-underline-offset:3px}
.foot .brand-word{color:var(--on-dark)}
.foot-legal{display:flex;flex-wrap:wrap;justify-content:space-between;gap:12px;margin-top:44px;padding-top:20px;border-top:1px solid var(--granite-2);color:var(--on-dark-muted);font-size:var(--fs-xs)}
.foot-legal nav{display:flex;gap:18px}

/* ============ Notice / misc ============ */
.note{border-left:3px solid var(--silk);padding:4px 0 4px 18px;max-width:64ch}
.note p:last-child{margin:0}
.tag-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.tag{font-size:var(--fs-xs);font-weight:600;border:1px solid var(--line);background:var(--paper);border-radius:var(--r-sm);padding:4px 9px}
.dark .tag{background:transparent;border-color:var(--granite-2);color:var(--on-dark-muted)}
.art-box{border-radius:var(--r);overflow:hidden;background:var(--granite)}
.art-box svg{width:100%;height:auto}
.show-band{display:grid;gap:16px 32px;align-items:center;background:var(--granite);color:var(--on-dark);border-radius:var(--r);padding:22px 26px}
@media(min-width:800px){.show-band{grid-template-columns:minmax(0,1fr) auto}}
.show-band p{margin:0;color:var(--on-dark-muted)}
.show-band b{color:var(--on-dark);font-stretch:112%;font-size:var(--fs-md);display:block;margin-bottom:2px}

/* ============ Phones ============ */
body{-webkit-tap-highlight-color:transparent}
.rail-dots{display:none}
@media(max-width:759px){
  .wrap{padding-inline:max(var(--gut),env(safe-area-inset-left)) max(var(--gut),env(safe-area-inset-right))}
  .section{padding-block:48px}
  .phead{padding-block:16px 32px}
  .crumbs{display:none}
  .back{display:inline-flex}
  .h1{font-size:2.125rem}
  .h2{font-size:1.625rem}
  .lead{font-size:1.125rem}
  .btn-row{margin-top:22px}
  .btn-row>.btn{flex:1 1 auto}

  /* hero: the pod becomes the main event */
  .hero{padding-block:18px 40px}
  .hero-grid{grid-template-areas:"copy" "scene" "act";gap:22px}
  .hero .display{font-size:2.5rem;line-height:1.02}
  .hero .lead{margin-top:14px;font-size:1.0625rem}
  .scene{grid-template-columns:1fr;max-width:none}

function qr(seed, fg, bg) {
  let h = hash(seed), cells = "";
  const n = 15, finder = (x, y) => (x < 4 && y < 4) || (x > n - 5 && y < 4) || (x < 4 && y > n - 5);
  for (let y = 0; y < n; y++) for (let x = 0; x < n; x++) {
    if (finder(x, y)) continue;
    h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0;
    if (h % 2) cells += `<rect x="${x}" y="${y}" width="1" height="1"/>`;
  }
  const f = (x, y) => `<rect x="${x}" y="${y}" width="4" height="4" fill="${fg}"/><rect x="${x + .8}" y="${y + .8}" width="2.4" height="2.4" fill="${bg}"/><rect x="${x + 1.5}" y="${y + 1.5}" width="1" height="1" fill="${fg}"/>`;
  return `<svg viewBox="-1 -1 ${n + 2} ${n + 2}" aria-hidden="true"><rect x="-1" y="-1" width="${n + 2}" height="${n + 2}" fill="${bg}"/><g fill="${fg}">${cells}</g>${f(0, 0)}${f(n - 4, 0)}${f(0, n - 4)}</svg>`;
}

function fieldHTML(f, idp) {
  const id = `${idp}-${f.name}`, opt = f.required ? "" : ' <span class="opt">(optional)</span>';
  const cls = `field ${f.full ? "full" : ""}`;
  const hint = f.hint ? `<div class="fhint" id="${id}-h">${esc(f.hint)}</div>` : "";
  const desc = `aria-describedby="${f.hint ? id + "-h " : ""}${id}-e"`;
  if (f.type === "chips") {
    return `<fieldset class="${cls}" data-name="${f.name}"><legend>${esc(f.label)}${opt}</legend><div class="chips">${f.options.map((o, i) =>
      `<label class="chip"><input type="radio" name="${f.name}" value="${esc(o)}" ${(f.value ? f.value === o : i === 0) ? "checked" : ""}><span>${esc(o)}</span></label>`).join("")}</div><div class="ferr" id="${id}-e" hidden></div></fieldset>`;
  }
  if (f.type === "select") {
    return `<div class="${cls}"><label for="${id}">${esc(f.label)}${opt}</label><select id="${id}" name="${f.name}" ${desc}><option value="">Choose one</option>${f.options.map(o => `<option ${f.value === o ? "selected" : ""}>${esc(o)}</option>`).join("")}</select>${hint}<div class="ferr" id="${id}-e" hidden></div></div>`;
  }
  if (f.type === "textarea") {
    return `<div class="${cls}"><label for="${id}">${esc(f.label)}${opt}</label><textarea id="${id}" name="${f.name}" ${desc} placeholder="${esc(f.placeholder || "")}"></textarea>${hint}<div class="ferr" id="${id}-e" hidden></div></div>`;
  }
  const t = f.type || "text", ac = { name: "name", email: "email", phone: "tel", company: "organization" }[f.name] || "off";
  return `<div class="${cls}"><label for="${id}">${esc(f.label)}${opt}</label><input id="${id}" name="${f.name}" type="${t}" autocomplete="${ac}" ${t === "tel" ? 'inputmode="tel"' : ""} ${["name", "company", "business", "venue"].includes(f.name) ? 'autocapitalize="words"' : ""} ${t === "email" ? 'autocapitalize="off" spellcheck="false"' : ""} ${desc} placeholder="${esc(f.placeholder || "")}">${hint}<div class="ferr" id="${id}-e" hidden></div></div>`;
}

function validate(f, v) {
  if (!v) return f.required ? (f.type === "select" ? "Choose an option." : `Enter ${f.errName || "your " + f.label.toLowerCase()}.`) : "";
  if (f.type === "email" && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(v)) return "Enter an email like name@company.com.";
  if (f.type === "tel") { let d = v.replace(/\D/g, ""); if (d.length === 12 && d.startsWith("91")) d = d.slice(2); if (d.length !== 10) return "Enter a 10-digit mobile number."; }
  return "";
}

function bindForm(id, cfg) {
  const form = $("#" + id); if (!form) return;
  form.addEventListener("submit", e => {
    e.preventDefault();
    let first = null; const vals = {};
    cfg.fields.forEach(f => {
      const v = f.type === "chips" ? (form.querySelector(`input[name="${f.name}"]:checked`)?.value || "") : (form.elements[f.name]?.value || "").trim();
      vals[f.name] = v;
      const msg = validate(f, v), err = $(`#${id}-${f.name}-e`), wrap = err?.closest(".field");
      if (err) { err.textContent = msg; err.hidden = !msg; }
      wrap?.classList.toggle("bad", !!msg);
      const input = form.elements[f.name]; if (input instanceof Element) input.setAttribute("aria-invalid", msg ? "true" : "false");
      if (msg && !first) first = f.type === "chips" ? form.querySelector(`input[name="${f.name}"]`) : form.elements[f.name];
    });
    const extraErr = cfg.check ? cfg.check() : "";
    const fe = form.querySelector("[data-form-error]"); fe.textContent = extraErr; fe.hidden = !extraErr;
    if (first) { first.focus(); return; }
    if (extraErr) { fe.focus?.(); return; }
    const lines = cfg.fields.filter(f => vals[f.name]).map(f => `${f.label}: ${vals[f.name]}`);
    const extra = cfg.extra ? cfg.extra() : "";
    const body = `${cfg.subject}\n\n${lines.join("\n")}${extra ? "\n\n" + extra : ""}`;
    window.open(waURL(body), "_blank", "noopener");
    buzz([10, 60, 14]);
    form.innerHTML = `<div class="done" tabindex="-1">
      <h3>${cfg.doneTitle || "Your message is ready in WhatsApp"}</h3>
      <p class="muted">Press send in WhatsApp to reach us. We reply ${SITE.replyTime}.</p>
      <div class="btn-row"><a class="btn btn--wa" href="${waURL(body)}" target="_blank" rel="noopener">${ICON.wa.replace("<svg", '<svg width="18" height="18"')} Open WhatsApp again</a>
        <a class="btn btn--ghost" href="${mailURL(cfg.subject, body)}">Email it instead</a></div>
      <details><summary>See the message</summary><pre>${esc(body)}</pre></details></div>`;
    form.querySelector(".done").focus();
  });
}

function calcTotals(q, months) {
  const units = q.pod + q.panel + q.sign;
  const monthly = q.pod * SITE.rates.pod + q.panel * SITE.rates.panel + q.sign * SITE.rates.sign;
  const gross = monthly * months, disc = gross * (SITE.durationDiscount[months] || 0) / 100;
  const net = gross - disc, gst = net * SITE.gst / 100;
  return { units, monthly, gross, disc, net, gst, total: net + gst };
}
function totalsHTML(t, months, extraTitle = "Your estimate") {
  const ok = t.units >= SITE.minUnits;
  return `<h2 class="h3">${extraTitle}</h2>
    <div class="sum-lines">
      <div><span>${t.units} ${t.units === 1 ? "unit" : "units"} × ${months} ${months === 1 ? "month" : "months"}</span><span>${inr(t.gross)}</span></div>
      ${t.disc ? `<div><span>${SITE.durationDiscount[months]}% multi-month saving</span><span>−${inr(t.disc)}</span></div>` : ""}
      <div><span>GST ${SITE.gst}%</span><span>${inr(t.gst)}</span></div>
      <div class="total"><span>Total</span><span>${inr(t.total)}</span></div>
    </div>
    <p class="minline ${ok ? "ok" : ""}">${ok ? `Meets the ${SITE.minUnits}-unit minimum.` : `Add ${SITE.minUnits - t.units} more ${SITE.minUnits - t.units === 1 ? "unit" : "units"} to meet the ${SITE.minUnits}-unit minimum.`}</p>`;
}
function initCalc() {
  const q = { pod: 3, panel: 0, sign: 0 }, max = { pod: 20, panel: 20, sign: 20 };
  const months = () => Number($('input[name="months"]:checked')?.value || 1);
  const draw = () => {
    ["pod", "panel", "sign"].forEach(id => { $("#q-" + id).textContent = q[id]; $(`[data-step="${id}"][data-d="-1"]`).disabled = q[id] === 0; });
    $("#calcOut").innerHTML = totalsHTML(calcTotals(q, months()), months());
  };
  $("#calc").addEventListener("click", e => { const b = e.target.closest("[data-step]"); if (!b) return; const id = b.dataset.step; q[id] = Math.max(0, Math.min(max[id], q[id] + Number(b.dataset.d))); draw(); });
  $("#calc").addEventListener("change", draw);
  draw();
  bindForm("rateForm", { subject: "Rate estimate request", submit: "", fields: [FIELDS.name, FIELDS.company, FIELDS.email, FIELDS.phone], doneTitle: "Your estimate is ready in WhatsApp",
    check: () => calcTotals(q, months()).units >= SITE.minUnits ? "" : `Choose at least ${SITE.minUnits} units before sending.`,
    extra: () => { const t = calcTotals(q, months()); return `Estimate: ${q.pod} digital pods, ${q.panel} wall panels, ${q.sign} standees for ${months()} month(s). Total ${inr(t.total)} incl. GST.`; } });
}

function initAvailability() {
  const sel = new Set();
  const campus = () => SITE.campuses.find(c => c.slug === $("#av-campus").value);
  const monthKey = () => $("#av-month").value;
  const monthLabel = () => $("#av-month").selectedOptions[0].textContent;
  const drawUnits = () => {
    const c = campus(), mk = monthKey();
    $("#units").innerHTML = c.units.map(u => {
      const b = booking(u, mk), f = fmtOf(u.fmt);
      let state, off = false;
      if (b.kind === "soon") { state = '<span class="status status--soon">Coming soon</span>'; off = true; }
      else if (b.kind === "excl") { off = b.booked; state = b.booked ? '<span class="status status--full">Booked this month</span>' : '<span class="status status--live">Open</span>'; }
      else { off = b.open === 0; state = `${off ? '<span class="status status--full">Full this month</span>' : `<span>${b.open} of ${SITE.slotsPerLoop} slots open</span>`}<span class="slots" aria-hidden="true">${Array.from({ length: SITE.slotsPerLoop }, (_, i) => `<i class="${i < b.sold ? "sold" : ""}"></i>`).join("")}</span>`; }
      if (off) sel.delete(u.id);
      return `<li class="unit ${off ? "off" : ""} ${sel.has(u.id) ? "sel" : ""}"><label>
        <input type="checkbox" value="${u.id}" ${off ? "disabled" : ""} ${sel.has(u.id) ? "checked" : ""}>
        <span><span class="unit-name">${esc(u.id)}, ${esc(f.name)}</span><span class="unit-meta" style="display:block">${esc(u.spot)}</span></span>
        <span class="unit-state">${state}</span></label></li>`;
    }).join("");
    drawSum();
  };
  const chosen = () => campus().units.filter(u => sel.has(u.id));
  const drawSum = () => {
    const list = chosen(), q = { pod: 0, panel: 0, sign: 0 };
    list.forEach(u => { if (q[u.fmt] !== undefined) q[u.fmt]++; });

function initTickets() {
  const s = SITE.show; let n = 2;
  const price = k => Math.floor(k / s.group.size) * s.group.price + (k % s.group.size) * s.price;
  const draw = () => {
    $("#tq").textContent = n; $('[data-t="-1"]').disabled = n <= 1;
    $("#ttotal").textContent = `Total ${inr(price(n))} for ${n} ${n === 1 ? "adult" : "adults"}`;
    setCtx(`<div class="ctx-info"><b>${inr(price(n))}</b><span>${n} ${n === 1 ? "adult" : "adults"}, ${esc(s.name)}</span></div><a class="btn btn--primary btn--sm" href="#/tickets" data-jump="ticket" data-focus="ticketForm-name">Reserve</a>`);
  };
  $("#ticket").addEventListener("click", e => { const b = e.target.closest("[data-t]"); if (!b) return; n = Math.max(1, Math.min(20, n + Number(b.dataset.t))); buzz(); draw(); });
  draw();
  watchAway($("#ticket"));
  const fields = [FIELDS.name, FIELDS.phone, { name: "email", label: "Email", type: "email" }];
  bindForm("ticketForm", { subject: `Ticket reservation: ${s.name}`, fields, doneTitle: "Your reservation is ready in WhatsApp",
    extra: () => `Day: ${$("#tday").selectedOptions[0].textContent}\nAdults: ${n}\nTotal: ${inr(price(n))}` });
}

/* =====================================================================
   Router, chrome, pod animation
   ===================================================================== */
const ROUTES = [
  [/^\/$/, () => V.home()],
  [/^\/events$/, () => V.events()],
  [/^\/events\/([\w-]+)$/, m => V.eventType(m[1])],
  [/^\/screens$/, () => V.screens()],
  [/^\/screens\/formats$/, () => V.formats()],
  [/^\/screens\/how-it-works$/, () => V.how()],
  [/^\/screens\/rates$/, () => V.rates()],
  [/^\/screens\/availability$/, (m, q) => V.availability(q)],
  [/^\/combined$/, () => V.combined()],
  [/^\/brief$/, (m, q) => V.brief(q)],
  [/^\/network$/, () => V.network()],
  [/^\/network\/([\w-]+)$/, m => V.campus(m[1])],
  [/^\/work$/, () => V.work()],
  [/^\/vendors$/, () => V.vendors()],
  [/^\/partner$/, () => V.partner()],
  [/^\/about$/, () => V.about()],
  [/^\/tickets$/, () => V.tickets()],
  [/^\/privacy$/, () => V.privacy()],
  [/^\/terms$/, () => V.terms()]
];
const NAV = () => [
  ["Events", "#/events", "/events"], ["Screens", "#/screens", "/screens"], ["Combined", "#/combined", "/combined"],
  ["Locations", "#/network", "/network"], ["Work", "#/work", "/work"], ["About", "#/about", "/about"],
  ...(showState() === "upcoming" ? [["Tickets", "#/tickets", "/tickets"]] : [])
];

const mqPhone = window.matchMedia("(max-width: 759px)");
const mqShell = window.matchMedia("(max-width: 1099px)");
const buzz = (p = 8) => { try { if (mqShell.matches && navigator.vibrate) navigator.vibrate(p); } catch {} };

function drawChrome() {
  if (SITE.demoBanner && sessionStorageSafe("get") !== "1") {
    $("#demo").innerHTML = `<div class="demo"><div class="wrap"><span>Template preview: phone numbers, campuses, prices and projects are sample content.</span><button type="button" id="demoHide">Hide</button></div></div>`;
    $("#demoHide").onclick = () => { sessionStorageSafe("set"); $("#demo").innerHTML = ""; };
  }
  const nav = NAV(), wa = waURL(`Hi ${SITE.name}`);
  $("#hdr").innerHTML = `<div class="wrap hdr-in">
    <a class="brand" href="#/" aria-label="${esc(SITE.name)} home">${MARK}<span class="brand-word">UPS <span>Events</span></span></a>
    <nav class="nav" aria-label="Main">${nav.map(n => `<a href="${n[1]}" data-base="${n[2]}">${n[0]}</a>`).join("")}</nav>
    <div class="hdr-cta">
      <a class="wa-link wide-only" href="${wa}" target="_blank" rel="noopener">${ICON.wa}WhatsApp</a>
      <a class="btn btn--ghost btn--sm xl-only" href="#/screens/rates">See rates</a>
      <a class="btn btn--primary btn--sm wide-only" href="#/brief">Start a brief</a>
      <a class="icon-btn" href="${wa}" target="_blank" rel="noopener" aria-label="Message us on WhatsApp">${ICON.wa}</a>
    </div></div>`;

  $("#tabbar").innerHTML = `
    <a class="tab" href="#/" data-base="/"><span class="tab-ico">${IC.home}</span>Home</a>
    <a class="tab" href="#/screens" data-base="/screens"><span class="tab-ico">${IC.screen}</span>Screens</a>
    <a class="tab tab--brief" href="#/brief" data-base="/brief"><span class="tab-fab">${IC.plus}</span>Brief</a>
    <a class="tab" href="#/events" data-base="/events"><span class="tab-ico">${IC.events}</span>Events</a>
    <button class="tab" type="button" id="moreBtn" aria-haspopup="dialog" aria-expanded="false"><span class="tab-ico">${IC.grid}</span>More</button>`;
  $("#moreBtn").onclick = e => Sheet.isOpen ? Sheet.close() : Sheet.open({ title: "Menu", html: moreHTML(), opener: e.currentTarget });
  $(".sheet-x").innerHTML = IC.close;

  $("#foot").innerHTML = `<div class="wrap"><div class="foot-grid">
    <div><a class="brand" href="#/" aria-label="${esc(SITE.name)} home">${MARK}<span class="brand-word">UPS <span>Events</span></span></a>
      <p style="margin-top:16px;color:var(--on-dark-muted);max-width:34ch">Advertising screens and events in ${esc(SITE.city)}'s office campuses.</p>
      <ul style="margin-top:16px"><li><a href="${telURL()}">${esc(SITE.phone)}</a></li><li><a href="mailto:${SITE.email}">${esc(SITE.email)}</a></li><li><a href="${waURL(`Hi ${SITE.name}`)}" target="_blank" rel="noopener">WhatsApp</a></li></ul></div>
    <div><h2>Screens</h2><ul><li><a href="#/screens">How it works</a></li><li><a href="#/screens/formats">Formats and specs</a></li><li><a href="#/screens/how-it-works">Booking terms</a></li><li><a href="#/screens/rates">Rates</a></li><li><a href="#/screens/availability">Check availability</a></li></ul></div>
    <div><h2>Events</h2><ul><li><a href="#/events">All event types</a></li>${SITE.eventTypes.map(t => `<li><a href="#/events/${t.slug}">${esc(t.name)}</a></li>`).join("")}${showState() === "upcoming" ? `<li><a href="#/tickets">Tickets: ${esc(SITE.show.name)}</a></li>` : ""}</ul></div>
    <div><h2>Company</h2><ul><li><a href="#/combined">Combined campaigns</a></li><li><a href="#/network">Locations</a></li><li><a href="#/work">Work</a></li><li><a href="#/vendors">Vendors</a></li><li><a href="#/partner">Partner with us</a></li><li><a href="#/about">About and contact</a></li></ul></div>
  </div>
  <div class="foot-legal"><span>© ${new Date().getFullYear()} ${esc(SITE.name)}${SITE.company.legalName ? ", " + esc(SITE.company.legalName) : ""}</span><nav aria-label="Legal"><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a></nav></div></div>`;

  const ld = { "@context": "https://schema.org", "@type": "LocalBusiness", name: SITE.name, telephone: SITE.phone, email: SITE.email, url: location.origin + location.pathname,
    address: { "@type": "PostalAddress", addressLocality: SITE.city, addressRegion: "Tamil Nadu", addressCountry: "IN" }, areaServed: SITE.city };
  const s = document.createElement("script"); s.type = "application/ld+json"; s.textContent = JSON.stringify(ld); document.head.appendChild(s);
}
function sessionStorageSafe(op) { try { return op === "get" ? sessionStorage.getItem("ups-demo-hidden") : sessionStorage.setItem("ups-demo-hidden", "1"); } catch { return null; } }

function moreHTML() {
  const s = SITE.show, showOn = showState() === "upcoming";
  const dest = [["Check availability", "#/screens/availability", IC.cal], ["Rates", "#/screens/rates", IC.rupee], ["Combined campaigns", "#/combined", IC.layers], ["Locations", "#/network", IC.pin],
    ["Work", "#/work", IC.work], ["Vendors", "#/vendors", IC.store], ["Partner with us", "#/partner", IC.building], ["About and contact", "#/about", IC.info]];
  return `<div class="quick">
      <a class="quick-tile" href="${telURL()}">${IC.phone}<span>Call</span></a>
      <a class="quick-tile quick-tile--wa" href="${waURL(`Hi ${SITE.name}`)}" target="_blank" rel="noopener">${ICON.wa}<span>WhatsApp</span></a>
      <a class="quick-tile" href="mailto:${SITE.email}">${IC.mail}<span>Email</span></a>
    </div>
    ${showOn ? `<a class="sheet-promo" href="#/tickets"><div><b>${esc(s.name)}</b><span>${showDates()}</span></div><em>Get tickets</em></a>` : ""}
    <nav class="dest" aria-label="More pages">${dest.map(d => `<a href="${d[1]}" data-base="${d[1].slice(1)}">${d[2]}<span>${d[0]}</span></a>`).join("")}</nav>
    <p class="sheet-legal"><a href="#/screens/formats">Formats and specs</a><a href="#/screens/how-it-works">Booking terms</a><a href="#/privacy">Privacy</a><a href="#/terms">Terms</a></p>`;
}

/* ---------- Bottom sheet: menu on phones, and the availability summary ---------- */
const Sheet = {
  isOpen: false, pushed: false, ignorePop: false, afterPop: null, el: null, home: null, opener: null, pending: null,
  outside: ["#demo", "#hdr", "#main", "#foot", "#tabbar", "#ctxbar", "#skip"],
  open({ title, html, el, opener }) {
    if (this.pending) { this.pending(); this.pending = null; }
    const host = $("#sheetHost"), body = $("#sheetBody"), sheet = $(".sheet", host);
    $("#sheetTitle").textContent = title;
    if (el) { this.el = el; this.home = document.createComment("sheet-home"); el.before(this.home); body.replaceChildren(el); }
    else { this.el = null; body.innerHTML = html; }
    body.scrollTop = 0;
    this.opener = opener || null;
    opener?.setAttribute("aria-expanded", "true");
    host.hidden = false; void host.offsetWidth; host.classList.add("open");
    this.outside.forEach(q => $(q)?.setAttribute("inert", ""));
    document.documentElement.classList.add("locked");
    this.isOpen = true;
    markCurrent(); buzz(6);
    try { history.pushState({ upsSheet: 1 }, ""); this.pushed = true; } catch { this.pushed = false; }
    setTimeout(() => sheet.focus({ preventScroll: true }), 40);
  },
  close(fromPop = false, then = null, instant = false) {
    if (!this.isOpen) { then?.(); return; }
    this.isOpen = false;
    const host = $("#sheetHost"), sheet = $(".sheet", host);
    host.classList.remove("open");
    this.outside.forEach(q => $(q)?.removeAttribute("inert"));
    document.documentElement.classList.remove("locked");
    const opener = this.opener; this.opener = null;
    opener?.setAttribute("aria-expanded", "false");
    const finish = () => {
      host.hidden = true; sheet.style.translate = "";
      if (this.el && this.home) this.home.replaceWith(this.el);
      this.el = null; this.home = null;
    };
    if (instant || reduceMotion()) finish();
    else { this.pending = finish; setTimeout(() => { if (this.pending === finish) { finish(); this.pending = null; } }, 340); }
    if (!then && opener?.isConnected) opener.focus({ preventScroll: true });
    if (this.pushed && !fromPop) { this.pushed = false; this.ignorePop = true; this.afterPop = then; history.back(); }
    else { this.pushed = false; then?.(); }
  }
};
window.addEventListener("popstate", () => {
  if (Sheet.ignorePop) { Sheet.ignorePop = false; const t = Sheet.afterPop; Sheet.afterPop = null; t?.(); return; }
  if (Sheet.isOpen) Sheet.close(true);
});
document.addEventListener("keydown", e => { if (e.key === "Escape" && Sheet.isOpen) Sheet.close(); });
$("#sheetHost").addEventListener("click", e => {
  if (e.target.closest("[data-sheet-close]")) { Sheet.close(); return; }
  const a = e.target.closest('a[href^="#/"]');
  if (a && $("#sheetBody").contains(a)) {
    e.preventDefault(); const href = a.getAttribute("href");
    Sheet.close(false, () => { if (location.hash !== href) location.hash = href; else window.scrollTo(0, 0); });
  }
});
(() => {   /* drag the sheet down to close it */
  const sheet = $("#sheetHost .sheet"); let y0 = null, t0 = 0, dy = 0;
  const start = e => { if (e.button > 0 || e.target.closest("button")) return; y0 = e.clientY; t0 = performance.now(); dy = 0; sheet.classList.add("dragging"); e.currentTarget.setPointerCapture?.(e.pointerId); };
  const move = e => { if (y0 === null) return; dy = Math.max(0, e.clientY - y0); sheet.style.translate = `0 ${dy}px`; };
  const end = () => {
    if (y0 === null) return; y0 = null; sheet.classList.remove("dragging");
    const v = dy / Math.max(1, performance.now() - t0);
    if (dy > 90 || (dy > 24 && v > .55)) Sheet.close(); else sheet.style.translate = "";
  };
  [".sheet-grab", ".sheet-head"].forEach(q => { const h = $(q, sheet); h.addEventListener("pointerdown", start); h.addEventListener("pointermove", move); h.addEventListener("pointerup", end); h.addEventListener("pointercancel", end); });
})();

/* ---------- Context bar: a page's main action, pinned above the tab bar on phones ---------- */
let ctxIO = null;
function setCtx(html) { const c = $("#ctxbar"); c.innerHTML = html; c.hidden = false; document.body.classList.add("has-ctx"); }
function clearCtx() { const c = $("#ctxbar"); c.hidden = true; c.innerHTML = ""; c.classList.remove("away"); document.body.classList.remove("has-ctx"); ctxIO?.disconnect(); ctxIO = null; }
function watchAway(target) {
  if (!target || !("IntersectionObserver" in window)) return;
  ctxIO = new IntersectionObserver(([en]) => $("#ctxbar").classList.toggle("away", en.isIntersecting), { threshold: .2 });
  ctxIO.observe(target);
}

/* ---------- Swipe rails: dots that follow the scroll ---------- */
function initRails() {
  $$("#main .rail").forEach(rail => {
    const items = [...rail.children]; if (items.length < 2) return;
    const dots = document.createElement("div"); dots.className = "rail-dots";
    dots.innerHTML = items.map((_, i) => `<button type="button" aria-label="Show ${i + 1} of ${items.length}" ${i ? "" : 'aria-current="true"'}></button>`).join("");
    rail.after(dots);
    const btns = [...dots.children];
    btns.forEach((b, i) => b.onclick = () => rail.scrollTo({ left: items[i].offsetLeft - parseFloat(getComputedStyle(rail).paddingLeft || 0), behavior: reduceMotion() ? "auto" : "smooth" }));
    if (!("IntersectionObserver" in window)) return;
    const io = new IntersectionObserver(ents => ents.forEach(en => {
      if (!en.isIntersecting || !mqPhone.matches) return;
      const k = items.indexOf(en.target);
      btns.forEach((b, j) => j === k ? b.setAttribute("aria-current", "true") : b.removeAttribute("aria-current"));
    }), { root: rail, threshold: .6 });
    items.forEach(it => io.observe(it));
  });
}

/* ---------- Hero pod: a story-style ad loop (tap to skip, hold to pause, swipe) ---------- */
function initPod() {
  const scr = $("#podScreen"); if (!scr) return;
  const ads = $$(".ad", scr), segs = $$(".segs i", scr), no = $("#slotNo"), btn = $("#podToggle");
  const DUR = 3600; let i = 0, playing = !reduceMotion(), held = false, visible = true;
  scr.style.setProperty("--dur", DUR + "ms");
  const sync = () => scr.classList.toggle("paused", !playing || held || !visible || document.hidden);
  const paint = () => {
    ads.forEach((a, k) => { const on = k === i; a.classList.toggle("on", on); a.inert = !on; on ? a.removeAttribute("aria-hidden") : a.setAttribute("aria-hidden", "true"); });
    segs.forEach((sg, k) => { sg.className = k < i ? "done" : ""; });
    void segs[i].offsetWidth; segs[i].className = "now";
    no.textContent = i + 1; sync();
  };
  const go = d => { i = (i + d + ads.length) % ads.length; paint(); };
  segs.forEach(sg => sg.firstElementChild.addEventListener("animationend", () => { if (sg.className === "now" && playing && !held) go(1); }));

  let downX = 0, downY = 0, holdT = null, suppress = false;
  $$(".tap", scr).forEach(t => {
    const release = () => { clearTimeout(holdT); if (held) { held = false; scr.classList.remove("held"); sync(); } };
    t.addEventListener("pointerdown", e => { downX = e.clientX; downY = e.clientY; suppress = false; clearTimeout(holdT); holdT = setTimeout(() => { held = suppress = true; scr.classList.add("held"); sync(); buzz(5); }, 260); });
    t.addEventListener("pointerup", e => { const dx = e.clientX - downX, dy = e.clientY - downY; release(); if (!suppress && Math.abs(dx) > 40 && Math.abs(dx) > Math.abs(dy)) { suppress = true; go(dx < 0 ? 1 : -1); buzz(); } });
    t.addEventListener("pointercancel", release); t.addEventListener("pointerleave", release);
    t.addEventListener("contextmenu", e => e.preventDefault());
    t.addEventListener("click", () => { if (suppress) { suppress = false; return; } go(t.classList.contains("tap--next") ? 1 : -1); buzz(); });
  });

  const label = () => { btn.setAttribute("aria-pressed", String(!playing)); btn.innerHTML = (playing ? ICON.pause : ICON.play) + `<span>${playing ? "Pause" : "Play"}</span>`; };
  btn.onclick = () => { playing = !playing; label(); sync(); };
  initPod.vis = sync;
  initPod.io?.disconnect();
  if ("IntersectionObserver" in window) { initPod.io = new IntersectionObserver(([en]) => { visible = en.isIntersecting; sync(); }, { threshold: .15 }); initPod.io.observe(scr); }
  label(); paint();
}

function markCurrent() {
  const path = render.path || "/", base = "/" + (path.split("/")[1] || "");
  $$("[data-base]").forEach(a => { const b = a.dataset.base; (b === path || (b !== "/" && base === b)) ? a.setAttribute("aria-current", "page") : a.removeAttribute("aria-current"); });
}

function render() {
  const raw = location.hash.slice(1);
  if (raw && !raw.startsWith("/")) return;             // plain in-page anchors
  const [path, qstr] = (raw || "/").split("?");
  const q = new URLSearchParams(qstr || "");
  if (Sheet.isOpen) Sheet.close(true, null, true);
  clearCtx(); initPod.io?.disconnect(); initPod.vis = null;
  let view = null;
  for (const [re, fn] of ROUTES) { const m = path.match(re); if (m) { view = fn(m, q); break; } }
  if (!view) view = V.notFound();
  $("#main").innerHTML = view.html;
  document.title = `${view.title} | ${SITE.name}`;
  render.path = path; markCurrent();
  view.init?.();
  initRails();
  window.scrollTo(0, 0);
  const h1 = $("#main h1"); if (h1 && render.started) { h1.setAttribute("tabindex", "-1"); h1.focus({ preventScroll: true }); }
  render.started = true;
}
function navigate() {
  if (document.startViewTransition && render.started && !reduceMotion()) document.startViewTransition(() => render());
  else render();
}

document.addEventListener("click", e => {
  const j = e.target.closest("[data-jump]"); if (!j) return;
  e.preventDefault(); const t = document.getElementById(j.dataset.jump); if (!t) return;
  t.scrollIntoView({ behavior: reduceMotion() ? "auto" : "smooth", block: "start" });
  const f = j.dataset.focus ? document.getElementById(j.dataset.focus) : t.querySelector("input,select,textarea");
  setTimeout(() => f?.focus({ preventScroll: true }), reduceMotion() ? 0 : 520);
});
document.addEventListener("click", async e => {
  const b = e.target.closest("[data-share]"); if (!b) return;
  const text = b.dataset.share, url = location.href;
  if (navigator.share) { try { await navigator.share({ title: document.title, text, url }); } catch {} return; }
  window.open(waURL(`${text} ${url}`), "_blank", "noopener");
});
$("#skip").addEventListener("click", e => { e.preventDefault(); const h = $("#main h1") || $("#main"); h.setAttribute("tabindex", "-1"); h.focus(); });
(() => {   /* phones and tablets: header slides away while reading, comes back when scrolling up */
  let lastY = scrollY, ticking = false; const hdr = $("#hdr");
  addEventListener("scroll", () => {
    if (ticking) return; ticking = true;
    requestAnimationFrame(() => {
      const y = scrollY;
      if (!mqShell.matches || y < 90) hdr.classList.remove("hdr--away");
      else if (y > lastY + 6) hdr.classList.add("hdr--away");
      else if (y < lastY - 6) hdr.classList.remove("hdr--away");
      lastY = y; ticking = false;
    });
  }, { passive: true });
  hdr.addEventListener("focusin", () => hdr.classList.remove("hdr--away"));
})();
mqPhone.addEventListener?.("change", () => { if (Sheet.isOpen && Sheet.el) Sheet.close(); });

drawChrome();
window.addEventListener("hashchange", navigate);
document.addEventListener("visibilitychange", () => initPod.vis?.());
render();
</script>
